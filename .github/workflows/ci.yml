name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Applies to every job, so every `npm ci` is covered.
#
# onnxruntime-node's postinstall downloads the CUDA/GPU build from
# api.nuget.org. It timed out three separate times on 2026-08-26 (runs
# 29638482403, 33025073649, 33038290262), each time burning a full CI cycle on
# an unrelated PR, and each time clearing on a plain re-run — a flake, not a
# dependency problem.
#
# Skipping it costs nothing here: the CPU runtime ships INSIDE the npm package
# (bin/napi-v6/linux/x64/libonnxruntime.so.1 + onnxruntime_binding.node), and
# the postinstall only fetches the GPU extras, which an ubuntu-latest runner
# has no GPU to use. fastembed embeddings and LiveKit's Silero VAD both run on
# the bundled CPU build — the eval gate and the docker smoke test prove it.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native addon build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 make g++ libasound2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - name: Install native addon build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 make g++ libasound2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Mastra build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          MASTRA_TELEMETRY_DISABLED: '1'
          APP_SECRET: ${{ secrets.CI_APP_SECRET }}
          SUPABASE_URL: https://stub.supabase.co
          SUPABASE_ANON_KEY: stub
          SUPABASE_SERVICE_ROLE_KEY: stub
          SUPABASE_DB_URL: postgres://stub:stub@localhost:5432/stub
          ANTHROPIC_API_KEY: stub
          LIVEKIT_URL: wss://stub.livekit.cloud
          LIVEKIT_API_KEY: stub
          LIVEKIT_API_SECRET: stub

  eval:
    runs-on: ubuntu-latest
    needs: typecheck
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mastra
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install native addon build deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3 make g++ libasound2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Start AIMock
        run: |
          docker run -d --name aimock \
            -p 4010:4010 \
            -v ${{ github.workspace }}/fixtures:/fixtures \
            ghcr.io/copilotkit/aimock -h 0.0.0.0 -f /fixtures
          echo "Waiting for AIMock on port 4010..."
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:4010/ > /dev/null 2>&1 && echo "AIMock ready" && exit 0
            sleep 1
          done
          echo "=== AIMock logs ===" && docker logs aimock
          echo "AIMock failed to start" && exit 1
      - name: Create empty .env for CI
        run: touch .env
      - name: Run eval gate
        run: npm run eval
        env:
          USE_AIMOCK: 'true'
          AIMOCK_URL: http://127.0.0.1:4010
          OPENAI_BASE_URL: http://127.0.0.1:4010/v1
          MASTRA_TELEMETRY_DISABLED: '1'
          APP_SECRET: ${{ secrets.CI_APP_SECRET }}
          SUPABASE_URL: https://stub.supabase.co
          SUPABASE_ANON_KEY: stub
          SUPABASE_SERVICE_ROLE_KEY: stub
          SUPABASE_DB_URL: postgres://postgres:postgres@localhost:5432/mastra
          ANTHROPIC_API_KEY: stub
          OPENAI_API_KEY: stub
          GOOGLE_GENERATIVE_AI_API_KEY: stub
          LIVEKIT_URL: wss://stub.livekit.cloud
          LIVEKIT_API_KEY: stub
          LIVEKIT_API_SECRET: stub
          NODE_ENV: test
          LOG_LEVEL: warn

  docker:
    runs-on: ubuntu-latest
    needs: build
    # The image cannot boot without a reachable Postgres — Mastra initialises
    # PostgresStore at startup and the process exits on
    # MASTRA_STORAGE_PG_INIT_FAILED. The first run of this smoke test proved
    # exactly that, which is precisely why it is worth having.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: mastra
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    # NO `if:` gate here. The workflow triggers already scope this to main
    # (pull_request -> [main], push -> [main]). Gating on push-to-main meant the
    # image was only ever validated AFTER a merge — so a breaking Dockerfile
    # landed on main before anyone saw it, and a PR could never prove the image
    # builds. `push: false` below keeps this a build-only check on PRs.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          # load into the local daemon so the smoke test below can actually run it
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: mastra:ci-${{ github.sha }}

      # voice-9jm.26 — building the image only proves it COMPILES. A broken CMD,
      # a missing runtime dep, or a bad tsx/loader path passes the build and then
      # fails on a consumer's VPS. Both processes get started here for real.
      #
      # Stub creds throughout: neither container should need to reach a real
      # service to get far enough to prove its entrypoint resolves.
      - name: Smoke test — server entrypoint answers /health
        run: |
          docker run -d --name smoke-server             --network host             -e MASTRA_TELEMETRY_DISABLED=1             -e APP_SECRET=smoke_test_stub_smoke_test_stub_32             -e SUPABASE_URL=https://stub.supabase.co             -e SUPABASE_ANON_KEY=stub             -e SUPABASE_SERVICE_ROLE_KEY=stub             -e SUPABASE_DB_URL=postgres://postgres:postgres@127.0.0.1:5432/mastra             -e ANTHROPIC_API_KEY=stub             -e LIVEKIT_URL=wss://stub.livekit.cloud             -e LIVEKIT_API_KEY=stub             -e LIVEKIT_API_SECRET=stub             mastra:ci-${{ github.sha }}

          echo "Waiting for /health on 4111..."
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4111/health > /dev/null 2>&1; then
              echo "server answered /health after ${i}s"
              exit 0
            fi
            # fail fast if the container died rather than burning the full timeout
            if [ "$(docker inspect -f '{{.State.Running}}' smoke-server 2>/dev/null)" != "true" ]; then
              echo "=== server container exited early ==="
              docker logs smoke-server
              exit 1
            fi
            sleep 1
          done
          echo "=== server never answered /health ==="
          docker logs smoke-server
          exit 1

      # The worker has no HTTP port, so there is nothing to poll. Stub LiveKit
      # creds mean it CANNOT authenticate — that is expected and is not what is
      # being tested. What is tested: the entrypoint resolves, tsx loads the
      # TypeScript source, and the process reaches LiveKit connection logic
      # instead of dying on a missing module or a bad path.
      - name: Smoke test — worker entrypoint boots
        run: |
          docker run -d --name smoke-worker             --network host             -e MASTRA_TELEMETRY_DISABLED=1             -e APP_SECRET=smoke_test_stub_smoke_test_stub_32             -e SUPABASE_URL=https://stub.supabase.co             -e SUPABASE_ANON_KEY=stub             -e SUPABASE_SERVICE_ROLE_KEY=stub             -e SUPABASE_DB_URL=postgres://postgres:postgres@127.0.0.1:5432/mastra             -e ANTHROPIC_API_KEY=stub             -e LIVEKIT_URL=wss://stub.livekit.cloud             -e LIVEKIT_API_KEY=stub             -e LIVEKIT_API_SECRET=stub             mastra:ci-${{ github.sha }}             node --import tsx src/mastra/voice-worker.ts start

          sleep 25
          docker logs smoke-worker > worker.log 2>&1
          echo "=== worker log ==="
          cat worker.log

          # A module-resolution or entrypoint failure looks completely different
          # from an auth failure. Catch the former explicitly.
          if grep -qiE "Cannot find module|ERR_MODULE_NOT_FOUND|ERR_UNKNOWN_FILE_EXTENSION|No such file or directory" worker.log; then
            echo "FAIL: worker entrypoint did not resolve — this is a packaging defect"
            exit 1
          fi

          # Reaching LiveKit at all proves the whole chain loaded: tini -> node
          # -> tsx -> voice-worker.ts -> @livekit/agents.
          if grep -qiE "livekit|worker|registering|connecting" worker.log; then
            echo "PASS: worker booted and reached LiveKit connection logic"
            exit 0
          fi

          echo "FAIL: worker produced no recognisable startup output"
          exit 1

      - name: Collect smoke-test logs on failure
        if: failure()
        run: |
          echo "=== smoke-server ===" && docker logs smoke-server 2>&1 || true
          echo "=== smoke-worker ===" && docker logs smoke-worker 2>&1 || true

      - name: Tear down smoke containers
        if: always()
        run: docker rm -f smoke-server smoke-worker 2>/dev/null || true
